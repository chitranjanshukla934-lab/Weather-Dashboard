<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather Dashboard</h1>

        <p id="dateTime"></p>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>


        <div class="weather-card">

            <img id="weatherIcon" src="" alt="Weather Icon" style="display:none;">


            <h2 id="cityName">City Name</h2>

            <h3 id="temperature">-- °C</h3>

            <p id="description">Weather Description</p>


            <div class="details">

                <div class="box">
                    <h4>Humidity</h4>
                    <p id="humidity">-- %</p>
                </div>


                <div class="box">
                    <h4>Wind</h4>
                    <p id="wind">-- km/h</p>
                </div>


                <div class="box">
                    <h4>Feels Like</h4>
                    <p id="feelsLike">-- °C</p>
                </div>


                <div class="box">
                    <h4>Pressure</h4>
                    <p id="pressure">-- hPa</p>
                </div>


                <div class="box">
                    <h4>Visibility</h4>
                    <p id="visibility">-- km</p>
                </div>


                <div class="box">
                    <h4>Sunrise</h4>
                    <p id="sunrise">--</p>
                </div>


                <div class="box">
                    <h4>Sunset</h4>
                    <p id="sunset">--</p>
                </div>


            </div>


        </div>


    </div>


    <script src="config.js"></script>
    <script src="script.js"></script>


</body>

</html>
